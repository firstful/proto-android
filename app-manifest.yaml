# App manifest for the Sutliff Apps build pipeline.
name: proto-android
subdomains:
  - hostname: proto.ffilt.us
    purpose: PROTO broker web UI + REST/WS (agent comms protocol)
apk:
  package: com.reedsutliff.protoapp
  path: android
  task: assembleRelease
  storeDir: Proto
  extraProps:
    telemetryUrl: https://telemetry.ffilt.us/
    protoUiUrl: https://proto.ffilt.us/
