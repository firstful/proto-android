# Talaria app manifest — declares the subdomain(s) the APK needs and the build.
# Schema documented in homelab-docs architecture/apk-build-pipeline.md.
name: talaria
subdomains:
  - hostname: talaria.ffilt.us
    purpose: voice PTT gateway (wss://talaria.ffilt.us/v1/ptt)
apk:
  package: com.reedsutliff.talaria
  path: android
  task: assembleRelease
  storeDir: Talaria
  publisher: reed
  extraProps:
    talariaWsUrl: wss://talaria.ffilt.us/v1/ptt
    telemetryUrl: https://telemetry.ffilt.us/
