name: Build APK + publish to store
on:
  push:
    branches: [main]
    paths: ['android/**', 'app-manifest.yaml', 'scripts/**', '.gitea/workflows/**']
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: [android]
    steps:
      - name: Install deps (SDK image lacks python3/node; git usually present)
        run: |
          apt-get update -qq >/dev/null 2>&1
          apt-get install -y -qq python3 curl git >/dev/null 2>&1
          python3 --version && git --version

      # Manual clone — actions/checkout@v4 is a node action and the android-sdk
      # image has no node. GITHUB_TOKEN is injected by Gitea Actions.
      - name: Clone repo
        run: |
          git clone --depth 50 "http://reeds:${GITHUB_TOKEN}@192.168.1.2:3000/${GITHUB_REPOSITORY}.git" .

      - name: Decode signing keystore
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$HOME/keystore.jks"
          echo "ANDROID_KEYSTORE_FILE=$HOME/keystore.jks" >> "$GITHUB_ENV"
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}

      - name: Ensure CF Access service token
        run: |
          python3 scripts/ci-ensure-access-token.py talaria.ffilt.us >> "$GITHUB_ENV"
        env:
          CF_MINT_TOKEN: ${{ secrets.CF_MINT_TOKEN }}
          CF_ACCOUNT_ID: 224469ecf8e8a619106fe8ffa19c7a43
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Build release APK
        run: |
          cd android
          ./gradlew :app:assembleRelease \
            -PcfAccessClientId="$CF_ACCESS_CLIENT_ID" \
            -PcfAccessClientSecret="$CF_ACCESS_CLIENT_SECRET" \
            -PtalariaWsUrl="wss://talaria.ffilt.us/v1/ptt" \
            --no-daemon
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Publish APK to store
        run: |
          set -euo pipefail
          cd android
          VERSION=$(./gradlew -q :app:printVersionName --no-daemon | tail -1)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK=$APK VERSION=$VERSION"
          curl -sf -X POST "http://appstore.appstore.svc.cluster.local:8080/publish/Talaria/$(basename "$APK")" \
            -H "X-Publish-Token: ${{ secrets.APPSTORE_PUBLISH_TOKEN }}" \
            -F "payload=@$APK" \
            -F "manifest={\"app\":\"com.reedsutliff.talaria\",\"name\":\"Talaria\",\"version\":\"$VERSION\"}"
          echo "PUBLISHED"
