name: Deploy Talaria
run-name: Build & Deploy Talaria

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: talaria
  CONTAINER_NAME: talaria
  HOST_PORT: 4002
  CONTAINER_PORT: 8321
  HERMES_API_URL: http://host.containers.internal:8642

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Docker CLI
        run: |
          apt-get update -qq
          apt-get install -y -qq ca-certificates curl
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian bookworm stable" > /etc/apt/sources.list.d/docker.list
          apt-get update -qq
          apt-get install -y -qq docker-ce-cli docker-buildx-plugin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:buildx-stable-1

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          load: true
          secrets: |
            "github_token=${{ github.token }}"
        env:
          DOCKER_BUILDKIT: 1

      - name: Stop and remove existing container
        run: |
          docker stop ${{ env.CONTAINER_NAME }} 2>/dev/null || true
          docker rm ${{ env.CONTAINER_NAME }} 2>/dev/null || true

      - name: Run new container
        run: |
          docker run -d \
            --name ${{ env.CONTAINER_NAME }} \
            --restart unless-stopped \
            -p ${{ env.HOST_PORT }}:${{ env.CONTAINER_PORT }} \
            --memory 2g \
            -e HOST=0.0.0.0 \
            -e PORT=${{ env.CONTAINER_PORT }} \
            -e TALARIA_DOMAIN=talaria.ffilt.us \
            -e HERMES_API_URL=${{ env.HERMES_API_URL }} \
            -e HERMES_API_KEY=${{ secrets.HERMES_API_KEY }} \
            -e STT_MODEL=base \
            -e LOG_LEVEL=info \
            -e HF_HOME=/app/cache \
            -v talaria-cache:/app/cache \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Verify container is running
        run: |
          sleep 10
          echo "=== Container status ==="
          docker ps --filter name=${{ env.CONTAINER_NAME }} --format "{{.ID}} {{.Status}} {{.Ports}}"
          echo "=== Health check ==="
          curl -s --max-time 10 http://localhost:${{ env.HOST_PORT }}/health && echo "" || echo "Health check not yet ready (build may still be starting)"
          echo "=== Deployed ==="
          echo "Container ${{ env.CONTAINER_NAME }} deployed on port ${{ env.HOST_PORT }}:${{ env.CONTAINER_PORT }}"
