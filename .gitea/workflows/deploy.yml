name: Deploy talaria
on: [push]

env:
  IMAGE: talaria:latest
  PORT: 8321

jobs:
  build-and-deploy:
    runs-on: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Install Docker CLI
        run: |
          apt-get update -qq
          apt-get install -y -qq docker.io 2>&1 | tail -3
          docker --version

      - name: Build image
        run: docker build -t $IMAGE -f Dockerfile .

      - name: Deploy
        run: |
          docker stop talaria 2>/dev/null || true
          docker rm talaria 2>/dev/null || true
          docker run -d \
            --name talaria \
            --restart always \
            -p 4002:$PORT \
            $IMAGE
