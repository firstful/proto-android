# Build performance + resilience on the homelab runner (reed-a320ms2h).
# The pod's egress is flaky — stall-fast + retry instead of hanging on
# dependency/AAR-metadata downloads (checkReleaseAarMetadata used to hang).
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g
org.gradle.internal.http.connectionTimeout=30000
org.gradle.internal.http.socketTimeout=30000
org.gradle.internal.repository.max.retries=5
org.gradle.internal.repository.initial.backoff=1000
org.gradle.parallel=true
