[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "talaria"
version = "1.0.0"
description = "Real-time voice PTT gateway for Hermes Agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "faster-whisper>=0.10.0",
    "edge-tts>=6.1.9",
    "numpy>=1.24.0",
    "httpx>=0.25.0",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = true
reportUnusedIgnoreComments = true
exclude = [
    "**/__pycache__",
    "**/.venv",
    "**/.git",
    "**/build",
    "**/dist",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
